name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zelora
          POSTGRES_PASSWORD: zelora
          POSTGRES_DB: zelora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zelora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://zelora:zelora@localhost:5432/zelora_test?schema=public
      JWT_SECRET: segredo-apenas-para-testes-no-ci

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o Prisma Client
        run: npx prisma generate

      - name: Aplicar as migrations no banco de teste
        run: npx prisma migrate deploy

      - name: Checar tipos (TypeScript)
        run: npx tsc --noEmit

      - name: Rodar os testes
        run: npm test